test_dataset:
  dataset:
    name: image-folder
    args:
      root_path: ./load/div2k/DIV2K_valid_HR
      first_k: 20 #n of images being tested
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: null
      scale_min: 4
      scale_max: 4
  batch_size: 1

data_norm:
  mean:
  - 0.5
  - 0.5
  - 0.5
  std:
  - 0.5
  - 0.5
  - 0.5

eval_type: div2k-4
eval_bsize: 10000
