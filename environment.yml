# Environment used for all results in the paper (recorded in every suite run's env.json):
# Python 3.12.2, PyTorch 2.5.1 + CUDA 12.1, Linux, NVIDIA V100.
#   conda env create -f environment.yml && conda activate recurrent_lte
# Run from the repository root (installs the bundled SPE package in editable mode).
name: recurrent_lte
channels:
  - defaults
dependencies:
  - python=3.12.2
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - numpy==1.26.4
      - pyyaml==6.0.1
      - pillow==10.2.0
      - tqdm
      - einops==0.8.2
      - lpips==0.1.4
      - scipy==1.12.0
      - pandas==3.0.6
      - matplotlib==3.11.2
      - imageio
      - scikit-image==0.22.0
      # training / data augmentation / auxiliary scripts only
      - timm==0.5.4
      - albumentations==1.4.1
      - opencv-python-headless==4.9.0.80
      - wandb==0.16.4
      - -e ./others/spe
